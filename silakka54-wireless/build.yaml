# GitHub Actions build matrix. Native silakka54 shield lives in
# config/boards/shields/silakka54. Sharp display = nice!view.
---
include:
  - board: nice_nano_v2
    shield: silakka54_left nice_view_adapter nice_view_silakka
    snippet: studio-rpc-usb-uart zmk-usb-logging
    artifact-name: silakka54_left
  - board: nice_nano_v2
    shield: silakka54_right nice_view_adapter nice_view_silakka
    artifact-name: silakka54_right
  - board: nice_nano_v2
    shield: settings_reset
    artifact-name: settings_reset
