# ZMK Studio (live keymap edits over USB on the left half)
CONFIG_ZMK_STUDIO=y

# Battery: deep sleep after 30 min idle
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Eager debounce
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=10

# Show the right half's battery on the left display and to the host
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Status screen (boards/shields/nice_view_silakka)
CONFIG_NICE_VIEW_SILAKKA_WPM_MAX=120
