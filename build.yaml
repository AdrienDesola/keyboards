# GitHub Actions build matrix. Native silakka54 shield lives in
# config/boards/shields/silakka54. Sharp display = nice!view.
---
include:
  - board: nice_nano_v2
    shield: silakka54_left nice_view_adapter nice_view
    snippet: studio-rpc-usb-uart
  - board: nice_nano_v2
    shield: silakka54_right nice_view_adapter nice_view
  - board: nice_nano_v2
    shield: settings_reset
