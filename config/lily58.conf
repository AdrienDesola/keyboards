CONFIG_ZMK_KEYBOARD_NAME="Silakka54"

# ZMK Studio (live keymap edits over USB on the left half)
CONFIG_ZMK_STUDIO=y

# Battery: deep sleep after 30 min idle
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Wireless range
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Eager debounce
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=10
